#---------------------------------------------------------------------#
# course information
#---------------------------------------------------------------------#
course:
  CLAS:
    code: 9710
    name: Thames Valley Golf Course Classic
  HKRY: 
    code: 9711
    name: Thames Valley Golf Club Hickory
  TRAD:
    code: 9714
    name: Fanshawe Golf Course Traditional
  QURY:
    code: 9713
    name: Fanshawe Golf Course The Quarry

#---------------------------------------------------------------------#
# authenticate information
#   - city of London userid and password
#---------------------------------------------------------------------#
authentication:
  userinfo1: 
    userid: xxxxx@gmail.com
    password: xxxxx
  userinfo2:
    userid: xxxxx@gmail.com
    password: xxxxx

#---------------------------------------------------------------------#
# redis
#   - redis connection information
#---------------------------------------------------------------------#
redis:
  host: 127.0.0.1
  port: 6379
    
#---------------------------------------------------------------------#
# setting of weekday:
#   - Empty weekday configurations automatically inherit from the nearest
#     defined day below them (e.g., MON and TUE inherit from WED).
# setting of special day:
#   - input the date you want into book_date field
#   - ex) book_date: 2023-09-11
#---------------------------------------------------------------------#
schedule:
  pro_song:
    auth: userinfo1
    weekdays:
      MON:
      TUE:
      WED:
        book_date:
        book_count: 1
        start_time: "14:00"
        duration: 60
        buffer: 0
        course:
          - TRAD
          - CLAS
          - QURY
      THU:
      FRI:
      SAT:
      SUN:
        book_date:
        book_count: 1
        start_time: "14:00"
        duration: 60
        buffer: 0        
        course:
          - QURY
          - QURY
          - TRAD
